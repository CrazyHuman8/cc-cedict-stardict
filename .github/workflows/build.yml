name: Build latest CC-CEDICT StarDict

on:
  workflow_dispatch:          # allows manual trigger
  schedule:
    - cron: '0 0 1 * *'      # optional: monthly rebuild

jobs:
  build:
    runs-on: ubuntu-22.04     # Python 3.10 has 'imp' module needed by penelope
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install penelope (Python dictionary converter)
        run: pip install penelope

      - name: Download latest CC-CEDICT data (raw text mirror)
        run: |
          curl -L -o cedict.csv "https://raw.githubusercontent.com/nicfab/cc-cedict/main/cedict_ts.u8"

      - name: Build the dictionary with liamsaliba's tool
        run: cargo run

      - name: Convert to StarDict format
        run: |
          penelope -i cedict.csv -j csv --csv-fs "\t" --csv-ls "\n\n" \
            -f cn -t en -p stardict -o cedict.zip \
            --merge-definitions --merge-separator "\n" -d \
            --title "CC-CEDICT 汉英词典"
          unzip cedict.zip

      - name: Upload dictionary files
        uses: actions/upload-artifact@v4
        with:
          name: cc-cedict-stardict-latest
          path: |
            cedict.ifo
            cedict.idx
            cedict.dict.dz
